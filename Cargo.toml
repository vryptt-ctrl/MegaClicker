[package]
name = "megaclicker"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "A very light but very powerful auto clicker for Windows"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
spin_sleep = "1.3"
thiserror = "2.0"
toml = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true