name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Build release
        run: cargo build --release
      
      - name: Strip binary
        run: |
          Get-ChildItem target/release/*.exe | ForEach-Object {
            & "x86_64-w64-mingw32-strip" $_.FullName
          }
      
      - name: Rename binary
        run: |
          Copy-Item target/release/megaclicker.exe "megaclicker-v${{ steps.version.outputs.VERSION }}-x64.exe"
      
      - name: Create zip
        run: Compress-Archive -Path "megaclicker-v${{ steps.version.outputs.VERSION }}-x64.exe" -DestinationPath "megaclicker-v${{ steps.version.outputs.VERSION }}-x64.zip"
      
      - name: Create checksums
        run: |
          $sha256 = Get-FileHash "megaclicker-v${{ steps.version.outputs.VERSION }}-x64.exe" -Algorithm SHA256
          Write-Host "SHA256: $($sha256.Hash)"
          "megaclicker-v${{ steps.version.outputs.VERSION }}-x64.exe $($sha256.Hash)" | Out-File -Encoding ASCII SHA256SUMS.txt
      
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            megaclicker-v${{ steps.version.outputs.VERSION }}-x64.exe
            megaclicker-v${{ steps.version.outputs.VERSION }}-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
